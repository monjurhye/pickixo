# =============================================================================
# Pickixo — nginx, behind Cloudflare
#
# Included from C:/tools/nginx-1.31.5/conf/nginx.conf. This is the only site on
# this server; hye.bd and its include were removed on 2026-09-12.
#
#   browser ⇄ Cloudflare (public certificate) ⇄ nginx (origin certificate)
#           ⇄ loopback ⇄ Next.js :3010 / FastAPI :8010
#
# Cloudflare's SSL/TLS mode must be at least "Full". On "Flexible", Cloudflare
# talks plain HTTP to this origin, the :80 block below redirects it to HTTPS,
# Cloudflare requests HTTP again, and the browser gets ERR_TOO_MANY_REDIRECTS.
# That is exactly the loop pickixo.com was in before this file existed.
# =============================================================================

# --- real client IP ---------------------------------------------------------
# Without this every request appears to come from a Cloudflare address. That is
# not merely cosmetic here: the guest AI allowance is keyed on a hash of the
# client IP, so all signed-out visitors worldwide would share a single daily
# bucket and the first few would exhaust it for everyone. Rate limiting and
# access logs would be equally meaningless.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched
# 2026-09-12. Cloudflare adds ranges occasionally; re-check on any odd
# rate-limit behaviour.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP is a single address Cloudflare sets itself and overwrites on
# every request, so it cannot be forged by the client. X-Forwarded-For can be.
real_ip_header    CF-Connecting-IP;
real_ip_recursive on;

# --- rate limiting ----------------------------------------------------------
# Zone names are global in nginx, so they are namespaced per site.
limit_req_zone  $binary_remote_addr  zone=pickixo_api:10m   rate=60r/m;
limit_req_zone  $binary_remote_addr  zone=pickixo_auth:10m  rate=10r/m;
limit_conn_zone $binary_remote_addr  zone=pickixo_conn:10m;

# --- default server ----------------------------------------------------------
# nginx hands any request whose Host matches no server_name to the first listen
# block for that port. hye.bd used to be that block; with it gone the role would
# have fallen to Pickixo by accident, meaning the site answered to the bare
# origin IP and to any hostname someone cared to point at it.
#
# 444 closes the connection without replying at all — the right answer to a
# request that was never addressed to us. Scanners hitting 165.99.63.228 get
# nothing, and legitimate traffic always carries a real Host.
#
# The ACME challenge is unaffected: Let's Encrypt sends Host: pickixo.com, which
# matches the named block below, not this one.
server {
    listen      80  default_server;
    listen      443 ssl default_server;
    server_name _;

    ssl_certificate     C:/ProgramData/win-acme/certs/pickixo.com-chain.pem;
    ssl_certificate_key C:/ProgramData/win-acme/certs/pickixo.com-key.pem;

    return 444;
}

upstream pickixo_web {
    server 127.0.0.1:3010;
    keepalive 16;
}

upstream pickixo_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

# --- http --------------------------------------------------------------------
#
# Redirecting everything on :80 to https is the obvious thing to write, and it is
# what puts a site behind Cloudflare's "Flexible" mode into an infinite redirect
# loop: Cloudflare fetches over HTTP, we answer "go to HTTPS", Cloudflare serves
# that redirect to a browser that is already on HTTPS, which asks again.
#
# Cloudflare tells us what the visitor's own connection actually was, in
# CF-Visitor. When that says https, the visitor is already secure and
# redirecting them is both pointless and the cause of the loop — so serve the
# request instead.
#
# This makes the loop impossible in any Cloudflare mode. It does NOT make
# "Flexible" acceptable: on Flexible the Cloudflare→origin hop crosses the public
# internet in cleartext, carrying session cookies with it. Set the zone to "Full"
# at minimum. This block is a guard against breakage, not a blessing.
map $http_cf_visitor $pickixo_visitor_is_https {
    default             0;
    "~*\"scheme\":\"https\"" 1;
}

server {
    listen      80;
    server_name pickixo.com www.pickixo.com;

    # Let's Encrypt HTTP-01. Must come before anything else, or the challenge
    # gets redirected and validation fails.
    location /.well-known/acme-challenge/ {
        root C:/tools/nginx-1.31.5/html;
        try_files $uri =404;
    }

    # IndexNow key file, also on :80.
    #
    # It has to be here as well as in the TLS block because while the Cloudflare
    # zone is on "Flexible", every request reaches this origin over plain HTTP —
    # so a location defined only on :443 is never consulted, and the key file
    # 404s. That is exactly what happened. It stays valid once the zone moves to
    # Full (strict), and IndexNow may probe either scheme.
    location ~ "^/[a-f0-9]{8,128}\.txt$" {
        root C:/Pickixo/wellknown;
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    location / {
        # A visitor Cloudflare already served over HTTPS, or a direct plaintext
        # request we should upgrade.
        if ($pickixo_visitor_is_https = 0) {
            return 301 https://pickixo.com$request_uri;
        }
        if ($host != "pickixo.com") {
            return 301 https://pickixo.com$request_uri;
        }

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The visitor really is on https, whatever this hop looks like.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_pass http://pickixo_web;
    }

    location /api/ {
        if ($pickixo_visitor_is_https = 0) {
            return 301 https://pickixo.com$request_uri;
        }
        limit_req zone=pickixo_api burst=20 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_pass http://pickixo_api;
        proxy_read_timeout 120s;
    }
}

# --- www → apex ---------------------------------------------------------------
# One canonical hostname. Two hostnames serving identical content is a
# duplicate-content problem, and every canonical tag the app emits already says
# the apex.
server {
    listen      443 ssl;
    http2       on;
    server_name www.pickixo.com;

    ssl_certificate     C:/ProgramData/win-acme/certs/pickixo.com-chain.pem;
    ssl_certificate_key C:/ProgramData/win-acme/certs/pickixo.com-key.pem;

    return 301 https://pickixo.com$request_uri;
}

# --- the site ------------------------------------------------------------------
server {
    listen      443 ssl;
    http2       on;
    server_name pickixo.com;

    # A real Let's Encrypt certificate, renewed automatically by the win-acme
    # scheduled task already on this machine. Publicly trusted, so Cloudflare can
    # be set to "Full (strict)" and will verify this origin rather than accepting
    # whatever answers. scripts/make-origin-cert.sh produced the self-signed
    # interim one this replaced.
    ssl_certificate     C:/ProgramData/win-acme/certs/pickixo.com-chain.pem;
    ssl_certificate_key C:/ProgramData/win-acme/certs/pickixo.com-key.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:PickixoSSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS is set by Cloudflare for the public connection; setting it here too
    # is harmless and covers anyone reaching the origin directly.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;
    client_body_timeout  60s;

    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    limit_conn pickixo_conn 24;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml+rss text/javascript image/svg+xml;

    access_log C:/tools/nginx-1.31.5/logs/pickixo-access.log;
    error_log  C:/tools/nginx-1.31.5/logs/pickixo-error.log warn;

    # --- shared proxy headers -------------------------------------------------
    # X-Forwarded-Proto is the one that matters: both apps decide "am I behind
    # TLS" from it, and a wrong value means redirects and absolute URLs come out
    # as http on an https site.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    # --- IndexNow key file ----------------------------------------------------
    # The protocol proves host control by fetching https://<host>/<key>.txt and
    # checking it contains the key. Served by nginx from outside the repository
    # so the key is never a file in version control.
    #
    # The regex matches only a hex filename at the root, and that directory
    # holds exactly one file, so this cannot become a way to read anything else.
    location ~ "^/[a-f0-9]{8,128}\.txt$" {
        root C:/Pickixo/wellknown;
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    # --- auth endpoints: tighter limit ---------------------------------------
    # Sign-in and sign-up are the endpoints worth guessing against. The
    # application does not yet do login rate limiting of its own, so until it
    # does, this is the only thing standing in front of a password-guessing run.
    location ~ ^/api/auth/(sign-in|sign-up|refresh) {
        limit_req zone=pickixo_auth burst=5 nodelay;
        proxy_pass http://pickixo_api;
    }

    location /api/ {
        limit_req zone=pickixo_api burst=20 nodelay;
        proxy_pass http://pickixo_api;
        proxy_read_timeout 120s;   # AI calls are slow; 60s would cut them off
    }

    # --- ML models ------------------------------------------------------------
    # The background remover runs in the visitor's browser, so the model file
    # itself is a public static asset. It is served from outside the repository
    # because it is 88 MB: version control is the wrong place for it, and the
    # deploy would carry it on every clone.
    #
    # The filename contains a hash of the contents, so a new model is a new URL
    # and this can be cached forever. That matters more here than anywhere else
    # on the site — re-downloading 88 MB because of a cache miss is the
    # difference between the tool feeling instant and feeling broken.
    #
    # The regex admits only the model naming shape, and the directory holds
    # only models, so this cannot be turned into a way to read other files.
    location ~ "^/models/[A-Za-z0-9._-]+\.onnx$" {
        root C:/Pickixo;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Already fp16 binary weights: brotli/gzip manage about 1.08x on this
        # and cost real CPU per request, so compression is deliberately off.
        gzip off;
        access_log off;
        try_files $uri =404;
    }

    # --- next.js --------------------------------------------------------------
    # Immutable build assets. The hashed filename changes whenever the content
    # does, so a year is safe and takes these off the origin entirely.
    location /_next/static/ {
        proxy_pass http://pickixo_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://pickixo_web;
        proxy_read_timeout 60s;
    }
}
